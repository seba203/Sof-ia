<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Sof-IA ☁️✨</title>

  <!-- Fuentes -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap"
    rel="stylesheet"
  >

  <!-- Estilos -->
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- MODAL DE INICIO DE SESIÓN Y CREDENCIALES -->
  <div id="key-modal" class="modal-overlay">
    <div class="modal-content">
      <h2>Bienvenida/o a Sof-IA 🌸</h2>
      <p>Ingresa tus datos de acceso asignados y tu API Key de Anthropic para comenzar.</p>
      
      <div class="input-group">
        <label for="login-username">Usuario:</label>
        <input type="text" id="login-username" placeholder="Ej: maria.perez">
      </div>

      <div class="input-group">
        <label for="login-code">Código de acceso:</label>
        <input type="password" id="login-code" placeholder="Tu clave asignada">
      </div>



      <div id="login-error" class="error-text" style="color: #e74c3c; display: none; margin-bottom: 10px;"></div>

      <button id="save-key-btn">Ingresar al Chat 🚀</button>
    </div>
  </div>


  <!-- Interfaz de Chat -->
  <div class="chat-container">

    <!-- Cabecera -->
    <header class="chat-header">

      <div class="title-area">
        <h1>Sof-IA-Agent ☁️</h1>
        <span class="subtitle">Asistente de Psicología</span>
      </div>

      <!-- Controles -->
      <div class="controls">

        <select id="mode-select">
          <option value="general">💬 Chat General (Haiku)</option>
          <option value="clinico">🎭 Roleplay Clínico (Haiku)</option>
          <option value="apa">📝 Revisión APA 7 (Sonnet)</option>
        </select>

        <button
          id="settings-btn"
          type="button"
          title="Configurar Clave"
        >
          ⚙️
        </button>

        <button
          id="theme-toggle"
          type="button"
          title="Cambiar tema"
          aria-label="Cambiar tema"
        >
          🌙
        </button>

        <!-- BOTÓN DE CERRAR SESIÓN -->
        <button
          id="logout-btn"
          class="logout-btn"
          type="button"
          title="Cerrar sesión"
        >
          Cerrar sesión 🚪
        </button>

      </div>

    </header>


    <!-- Área de mensajes -->
    <main id="chat-box" class="chat-box"></main>


    <!-- Área de escritura -->
    <footer class="chat-input-area">

      <textarea
        id="user-input"
        placeholder="Escribe tu consulta o pega tu ensayo aquí... 🌸"
        rows="2"
      ></textarea>

      <button id="send-btn" type="button">
        Enviar 🎀
      </button>

    </footer>

  </div>


  <!-- Librerías para interpretar Markdown -->
  <script src="https://cdn.jsdelivr.net/npm/marked@15.0.7/marked.min.js"></script>

  <!-- Protección y limpieza del HTML generado -->
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>

  <!-- SDK de Supabase JS -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- JavaScript principal de Sof-IA -->
  <script src="app.js"></script>

</body>
</html>
